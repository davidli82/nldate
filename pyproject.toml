[project]
name = "nldate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
